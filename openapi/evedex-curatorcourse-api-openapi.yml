openapi: 3.2.0
info:
  title: EVEDEX - Academy Curator Course API
  version: 1.0.0
servers:
- url: https://academy.evedex.com
tags:
- name: CuratorCourse
paths:
  /api/course/{courseId}/curator:
    get:
      tags:
      - CuratorCourse
      security:
      - AccessToken: []
      parameters:
      - in: path
        name: courseId
        schema:
          type: string
        required: true
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseCuratorObjectList'
      summary: Get api course by course id curator
      x-summary-source: derived
      operationId: getApiCourseByCourseIdCurator
      x-operation-id-source: derived
    post:
      tags:
      - CuratorCourse
      security:
      - AccessToken: []
      parameters:
      - in: path
        name: courseId
        schema:
          type: string
        required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCourseCurator'
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseCuratorObject'
      summary: Create api course by course id curator
      x-summary-source: derived
      operationId: postApiCourseByCourseIdCurator
      x-operation-id-source: derived
  /api/course/{courseId}/curator/{curatorId}:
    delete:
      tags:
      - CuratorCourse
      security:
      - AccessToken: []
      parameters:
      - in: path
        name: courseId
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: curatorId
        schema:
          type: string
          format: uuid
        required: true
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
      summary: Delete api course by course id curator by curator id
      x-summary-source: derived
      operationId: deleteApiCourseByCourseIdCuratorByCuratorId
      x-operation-id-source: derived
components:
  schemas:
    CourseCuratorObject:
      type: object
      properties:
        id:
          type: string
          format: uuid
        course:
          type: string
          format: uuid
        curator:
          type: string
          format: uuid
        createdAt:
          type: string
      required:
      - id
      - course
      - curator
      - createdAt
    CourseCuratorObjectList:
      type: array
      items:
        $ref: '#/components/schemas/CourseCuratorObject'
    EmptyResponse:
      type: object
    CreateCourseCurator:
      type: object
      properties:
        curator:
          type: string
      required:
      - curator
  securitySchemes:
    AccessToken:
      type: http
      scheme: bearer
    InternalKey:
      type: http
      scheme: bearer
