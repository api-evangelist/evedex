                            referralBoost:
                              type: object
                              properties:
                                percent:
                                  type: number
                                durationHours:
                                  type: number
                              required:
                              - percent
                              - durationHours
                            collectibleChance:
                              type: number
                          additionalProperties: false
                        status:
                          type: string
                          enum:
                          - new
                          - readyToClaim
                          - claimed
                      required:
                      - id
                      - type
                      - requiredCrystals
                      - requiredTradingVolume
                      - rewardXp
                      - reward
                      - status
                      additionalProperties: false
                required:
                - date
