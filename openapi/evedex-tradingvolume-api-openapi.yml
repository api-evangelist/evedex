  version: 1.0.0
servers:
- url: https://partner-api.evedex.com
tags:
- name: TradingVolume
paths:
  /api/tradingVolume/referral-info:
    get:
      tags:
      - TradingVolume
      security:
      - AccessToken: []
        ApiKey: []
      parameters:
      - in: query
        name: after
        schema:
          type:
          - string
          - 'null'
      - in: query
        name: before
        schema:
          type:
          - string
          - 'null'
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradingVolumeReferralInfoResponse'
      summary: Get api trading volume referral info
      x-summary-source: derived
      operationId: getApiTradingVolumeReferralInfo
      x-operation-id-source: derived
components:
