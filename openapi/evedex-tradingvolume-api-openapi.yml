      type: object
      properties:
        tradingVolume:
          type: string
      required:
      - tradingVolume
  securitySchemes:
    AccessToken:
      type: http
      scheme: bearer
    ApiKey:
      type: apiKey
      in: header
      name: X-API-Key
    InternalKey:
      type: http
      scheme: bearer
