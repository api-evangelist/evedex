                        riskLevel:
                          type: string
                          enum:
                          - low
                          - medium
                          - high
                          - critical
                        liquidityProviderMode:
                          type: string
                          enum:
                          - enable
                          - disable
                          - skip
                          - pause
                        leverage:
                          type: number
                        riskLevels:
                          type: array
                          items:
                            type: object
                            properties:
                              volume:
                                type: number
                              level:
                                type: string
                                enum:
                                - low
                                - medium
                                - high
                                - critical
                              liquidity:
                                type: string
                                enum:
                                - enable
                                - disable
                                - skip
                                - pause
                              positionClose:
                                type: object
                                properties:
