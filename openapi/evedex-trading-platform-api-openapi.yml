                                - step
                          required:
                          - interval
                          - volume
                      required:
                      - volume
                      - level
                      - liquidity
                  orderTTL:
                    type: number
                  liquidityUpdateInterval:
                    type: number
                  createdAt:
                    type: string
                  updatedAt:
                    type: string
