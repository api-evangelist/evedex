                                      - max
                                      - step
                                required:
                                - interval
                                - volume
                            required:
                            - volume
                            - level
                            - liquidity
                        orderTTL:
                          type: number
                        liquidityUpdateInterval:
                          type: number
                        createdAt:
                          type: string
                        updatedAt:
                          type: string
                      required:
                      - id
                      - pair
                      - name
                      - positionSide
                      - positionQuantity
                      - positionVolume
                      - riskLevel
                      - liquidityProviderMode
                      - leverage
                      - riskLevels
                      - orderTTL
                      - liquidityUpdateInterval
                      - createdAt
                      - updatedAt
                  count:
                    type: number
                  next:
                    type: string
                required:
                - list
                - count
    post:
      tags:
      - Trading Platform
      security:
      - AccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pair:
                  type: string
                name:
                  type: string
                leverage:
                  type: number
                privateKey:
                  type: string
                apiKey:
                  type: string
                riskLevels:
                  type: array
                  items:
                    type: object
                    properties:
                      volume:
                        type: number
                      level:
                        type: string
                        enum:
                        - low
                        - medium
                        - high
                        - critical
                      liquidity:
                        type: string
                        enum:
                        - enable
                        - disable
                        - skip
                        - pause
                      positionClose:
                        type: object
                        properties:
                          interval:
                            type: number
                          volume:
                            anyOf:
                            - type: number
                            - type: object
                              properties:
                                min:
                                  type: number
                                max:
                                  type: number
                                step:
                                  type: number
                              required:
                              - min
                              - max
                              - step
                        required:
                        - interval
                        - volume
                    required:
                    - volume
                    - level
                    - liquidity
                orderTTL:
                  type: number
                liquidityUpdateInterval:
                  type: number
              required:
              - pair
              - name
              - leverage
              - privateKey
              - apiKey
              - riskLevels
              - orderTTL
              - liquidityUpdateInterval
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  pair:
                    type: string
                  name:
                    type: string
                  positionSide:
                    type: string
                    enum:
                    - BUY
                    - SELL
                  positionQuantity:
                    type: string
                  positionVolume:
                    type: string
                  riskLevel:
                    type: string
                    enum:
                    - low
                    - medium
                    - high
                    - critical
                  liquidityProviderMode:
                    type: string
                    enum:
                    - enable
                    - disable
                    - skip
                    - pause
                  leverage:
                    type: number
                  riskLevels:
                    type: array
                    items:
                      type: object
                      properties:
                        volume:
                          type: number
                        level:
                          type: string
                          enum:
                          - low
                          - medium
                          - high
                          - critical
                        liquidity:
                          type: string
                          enum:
                          - enable
                          - disable
                          - skip
                          - pause
                        positionClose:
                          type: object
                          properties:
                            interval:
                              type: number
                            volume:
                              anyOf:
                              - type: number
                              - type: object
                                properties:
                                  min:
                                    type: number
