                - pair
                - name
                - positionSide
                - positionQuantity
                - positionVolume
                - riskLevel
                - liquidityProviderMode
                - leverage
                - riskLevels
                - orderTTL
                - liquidityUpdateInterval
                - createdAt
                - updatedAt
components:
  schemas:
    PageLimitParam:
      type: string
      default: '50'
    PageOffsetParam:
      type: string
      default: '0'
  securitySchemes:
    AccessToken:
      type: http
      scheme: bearer
