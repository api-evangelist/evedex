openapi: 3.2.0
info:
  title: EVEDEX - Backoffice general Hedging API
  version: 1.0.0
servers:
- url: https://backoffice-api.private.evedex.com
tags:
- name: Hedging
paths:
  /api/hedging/finery/account:
    post:
      tags:
      - Hedging
      security:
      - AccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FineryAccountObject'
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
      summary: Create api hedging finery account
      x-summary-source: derived
      operationId: postApiHedgingFineryAccount
      x-operation-id-source: derived
  /api/hedging/bybit/account:
    post:
      tags:
      - Hedging
      security:
      - AccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BybitAccountObject'
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
      summary: Create api hedging bybit account
      x-summary-source: derived
      operationId: postApiHedgingBybitAccount
      x-operation-id-source: derived
components:
  schemas:
    FineryAccountObject:
      type: object
      properties:
        user:
          type: string
          format: uuid
        name:
          type: string
        apiKey:
          type: string
        apiSecret:
          type: string
      required:
      - user
      - name
      - apiKey
      - apiSecret
    EmptyResponse:
      type: object
    BybitAccountObject:
      type: object
      properties:
        user:
          type: string
          format: uuid
        name:
          type: string
        accountType:
          type: string
          enum:
          - UNIFIED
          - REGULAR
        apiKey:
          type: string
        apiSecret:
          type: string
      required:
      - user
      - name
      - accountType
      - apiKey
      - apiSecret
  securitySchemes:
    AccessToken:
      type: http
      scheme: bearer
