components:
  schemas:
    User:
      type: object
      properties:
        authId:
          type: string
          format: uuid
        wallet:
          type: string
        avatar:
          type: string
          format: uri
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
      - authId
      - wallet
      - avatar
      - createdAt
      - updatedAt
    UpdateUserBody:
      type: object
      properties:
        role:
          type: string
          enum:
          - admin
          - manager
          - user
          - academy-curator
          - academy-moderator
      required:
      - role
    TelegramProfile:
      type: object
      properties:
        id:
          type: string
        username:
          type:
          - string
          - 'null'
        firstName:
          type:
          - string
          - 'null'
        lastName:
          type:
          - string
          - 'null'
      required:
      - id
      - username
      - firstName
      - lastName
    JWT:
      type: object
      properties:
        accessToken:
          type: string
          description: JWT access token
        refreshToken:
          type: string
          description: JWT refresh token
      required:
      - accessToken
      description: JWT tokens
    UserMediaListResponse:
      type: object
      properties:
        list:
          type: array
          items:
            $ref: '#/components/schemas/UserMedia'
        count:
          type: number
        next:
          type: string
      required:
      - list
      - count
    UpdateUserReferralCodeBody:
      type: object
      properties:
        referralCode:
          type: string
      required:
      - referralCode
    UserTradingViewSettingsBody:
      type: object
      properties:
        settings:
          type: string
      required:
      - settings
    SignUpBody:
      type: object
      properties:
        name:
          type: string
          default: ''
          description: Account name
        wallet:
          type: string
          description: Wallet address
        message:
          type: string
          description: Signed message
        signature:
          type: string
          minLength: 1
          description: Signature
        referralCode:
          type:
          - string
          - 'null'
          description: Referral code
        source:
          type: string
          default: unknown
          description: Source
        method:
          type: string
          enum:
          - email
          - google
          - apple
          - wallet
          - telegram
          - twitter
          default: wallet
          description: Used sign-up method
        nonce:
          type: string
          minLength: 1
          description: Nonce
        userId:
          type: string
          format: uuid
          description: Target user id
        type:
          type: string
          enum:
          - user
          - autotest
          default: user
          description: User type
        utm:
          type: object
          properties:
            source:
              type: string
            medium:
              type: string
            campaign:
              type: string
            term:
              type: string
            content:
              type: string
        tracking:
          type: object
          properties:
            params:
              type: object
              propertyNames:
                type: string
                maxLength: 64
              additionalProperties:
                type: string
                maxLength: 512
          required:
          - params
        twofa:
          type: object
          properties:
            code:
              type: string
          required:
          - code
        fingerprint:
          type: string
        visitorId:
          type: string
        walletSource:
          type: string
          enum:
          - evedex
          - evedex_mobile_create
          - evedex_mobile_import
          default: evedex
      required:
      - wallet
      - message
      - signature
      - nonce
      additionalProperties: false
    UserTradingViewSettingsResponse:
      type: object
      properties:
        settings:
          type:
          - string
          - 'null'
      required:
      - settings
    WalletTransferWithFeesObject:
      allOf:
      - $ref: '#/components/schemas/WalletTransferObject'
      type: object
      properties:
        fees:
          type: array
          items:
            $ref: '#/components/schemas/WalletTransferObject'
      required:
      - fees
    ApiKeyCreateResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        expireAt:
          type:
          - string
          - 'null'
          default: null
        apiKey:
          type: string
      required:
      - id
      - expireAt
      - apiKey
    PageLimitParam:
      type: string
      default: '50'
    EmptyResponse:
      type: object
    UserSubscriptionsResponse:
      type: array
      items:
        type: object
        properties:
          id:
            type: string
            format: uuid
          subscriptionStatus:
            type: string
            enum:
            - none
            - expired
            - active
            - canceling
            - renewed
            default: none
          privilegiesType:
            type:
            - string
            - 'null'
            enum:
            - premium
            - academyCourse
            default: null
        required:
        - id
        - subscriptionStatus
        - privilegiesType
    FingerprintVerifyBody:
      type: object
      properties:
        visitorId:
          type: string
        authId:
          type: string
          format: uuid
      required:
      - visitorId
      - authId
    ApiKeyObject:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        mask:
          type: string
        isArchived:
          type: boolean
        expireAt:
          type:
          - string
          - 'null'
        createdAt:
          type: string
        updatedAt:
          type:
          - string
          - 'null'
        deletedAt:
          type:
          - string
          - 'null'
        settings:
          type: object
          properties:
            scopes:
              type: array
              items:
                type: string
                enum:
                - partner
                - exchange
              default: []
          required:
          - scopes
      required:
      - id
      - name
      - mask
      - isArchived
      - expireAt
      - createdAt
      - updatedAt
      - deletedAt
      - settings
    PageOffsetParam:
      type: string
      default: '0'
    ApiKeyCreateBody:
      type: object
      properties:
        name:
          type: string
        expireAt:
          type:
          - string
          - 'null'
          default: null
        scopes:
          type: array
          items:
            type: string
            enum:
            - partner
            - exchange
          default: []
      required:
      - name
    UserFingerprintResponse:
      type: object
      properties:
        visitorId:
          type:
          - string
          - 'null'
        relatedAuthIds:
          type: array
          items:
            type: string
            format: uuid
      required:
      - visitorId
      - relatedAuthIds
