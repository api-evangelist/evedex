openapi: 3.2.0
info:
  title: Evedex User API
  version: 1.0.0
  description: 'Operations tagged User across 7 of this provider''s published API definitions: evedex-academy-openapi.json, evedex-auth-openapi.json, evedex-backoffice-openapi.json, evedex-exchange-openapi.json, evedex-game-openapi.json, evedex-notifications-openapi.json, evedex-referral-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://academy.evedex.com
- url: https://auth-api.evedex.com
- url: https://backoffice-api.private.evedex.com
- url: https://exchange-api.evedex.com
- url: https://game-api.evedex.com
- url: https://notifications-api.evedex.com
- url: https://partner-api.evedex.com
tags:
- name: User
paths:
  /api/user/me:
    get:
      tags:
      - User
      security:
      - AccessToken: []
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
    servers:
    - url: https://academy.evedex.com
  /api/user/account:
    post:
      tags:
      - User
      security:
      - AccessToken: []
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
    servers:
    - url: https://academy.evedex.com
  /auth/user/subscriptions/lookup:
    post:
      tags:
      - User
      security:
      - InternalToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLookupBody'
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSubscriptionsResponse'
    servers:
    - url: https://auth-api.evedex.com
  /auth/user/media/list:
    get:
      tags:
      - User
      security:
      - InternalToken: []
      parameters:
      - in: query
        name: limit
        schema:
          $ref: '#/components/schemas/PageLimitParam'
      - in: query
        name: offset
        schema:
          $ref: '#/components/schemas/PageOffsetParam'
      - in: query
        name: authId
        description: Filter by specific user ID
        schema:
          type: string
          format: uuid
          description: Filter by specific user ID
      - in: query
        name: authIds
        description: Filter by specific user IDs
        schema:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
          maxItems: 20
          description: Filter by specific user IDs
      - in: query
        name: email
        schema:
          type: string
      - in: query
        name: telegram
        schema:
          type: string
      - in: query
        name: discord
        schema:
          type: string
      - in: query
        name: mobilePushEnabled
        schema:
          type: string
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMediaListResponse'
    servers:
    - url: https://auth-api.evedex.com
  /auth/user/{authId}/balance:
    get:
      tags:
      - User
      security:
      - InternalToken: []
      parameters:
      - in: path
        name: authId
        schema:
          type: string
          format: uuid
        required: true
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WalletBalanceObject'
    servers:
    - url: https://auth-api.evedex.com
  /auth/user/balance:
    get:
      tags:
      - User
      security:
      - AccessToken: []
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WalletBalanceObject'
    servers:
    - url: https://auth-api.evedex.com
  /auth/user/{id}:
    put:
      tags:
      - User
      security:
      - InternalToken: []
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserBody'
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User_2'
    delete:
      tags:
      - User
      security:
      - InternalToken: []
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
    servers:
    - url: https://auth-api.evedex.com
  /auth/user/sign-up:
    post:
      tags:
      - User
      security: []
      parameters:
      - in: query
        name: noCookieReplace
        schema:
          type: string
          enum:
          - 'yes'
          - 'no'
          - ''
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpBody'
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Auth'
    servers:
    - url: https://auth-api.evedex.com
  /auth/user/{id}/referral-code:
    put:
      tags:
      - User
      security:
      - AccessToken: []
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserReferralCodeBody'
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
    servers:
    - url: https://auth-api.evedex.com
  /auth/user/me:
    get:
      tags:
      - User
      security:
      - AccessToken: []
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User_2'
    servers:
    - url: https://auth-api.evedex.com
  /auth/user/logout:
    post:
      tags:
      - User
      security:
      - AccessToken: []
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
    servers:
    - url: https://auth-api.evedex.com
  /auth/location:
    get:
      tags:
      - User
      security: []
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationResponse'
    servers:
    - url: https://auth-api.evedex.com
  /auth/links/{type}:
    get:
      tags:
      - User
      security: []
      parameters:
      - in: path
        name: type
        schema:
          type: string
        required: true
      - in: query
        name: utm_source
        schema:
          type: string
      - in: query
        name: utm_medium
        schema:
          type: string
      - in: query
        name: utm_campaign
        schema:
          type: string
      - in: query
        name: utm_term
        schema:
          type: string
      - in: query
        name: utm_content
        schema:
          type: string
      responses:
        '302':
          description: 302 OK
    servers:
    - url: https://auth-api.evedex.com
  /auth/user:
    get:
      tags:
      - User
      security:
      - InternalToken: []
      parameters:
      - in: query
        name: id
        description: Account ID
        schema:
          type:
          - string
          - 'null'
          description: Account ID
      - in: query
        name: wallet
        description: Wallet address
        schema:
          type:
          - string
          - 'null'
          description: Wallet address
      - in: query
        name: smartAccountAddress
        description: Smart account address
        schema:
          type:
          - string
          - 'null'
          description: Smart account address
      - in: query
        name: email
        description: Email address
        schema:
          type: string
          description: Email address
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              schema:
                type:
                - object
                - 'null'
                properties:
                  id:
                    type: string
                    format: uuid
                  avatar:
                    type:
                    - string
                    - 'null'
                  cover:
                    type:
                    - string
                    - 'null'
                  wallet:
                    type: string
                  role:
                    type: string
                    enum:
                    - admin
                    - manager
                    - user
                    - academy-curator
                    - academy-moderator
                  name:
                    type:
                    - string
                    - 'null'
                  status:
                    type:
                    - string
                    - 'null'
                  description:
                    type:
                    - string
                    - 'null'
                  email:
                    type:
                    - string
                    - 'null'
                  locale:
                    type: string
                    enum:
                    - en-US
                    - ru-RU
                    - es-ES
                    - fr-FR
                    - de-DE
                    - it-IT
                    - pt-BR
                    - ja-JP
                    - ko-KR
                    - zh-CN
                    - zh-TW
                    - ar-SA
                    - pt-PT
                    - tr-TR
                    - uk-UA
                  telegramProfile:
                    type:
                    - object
                    - 'null'
                    properties:
                      shortUsername:
                        type: string
                    required:
                    - shortUsername
                  discordId:
                    type:
                    - string
                    - 'null'
                  discordName:
                    type:
                    - string
                    - 'null'
                  mobilePushEnabled:
                    type: boolean
                  referralCode:
                    type:
                    - string
                    - 'null'
                  smartAccountsList:
                    type: array
                    items:
                      type: object
                      properties:
                        network:
                          type: string
                        address:
                          type: string
                        version:
                          type: number
                        isDeployed:
                          type: boolean
                      required:
                      - network
                      - address
                      - version
                      - isDeployed
                    description: User owned smart accounts list
                  parentSmartAccountList:
                    type: array
                    items:
                      type: object
                      properties:
                        network:
                          type: string
                        address:
                          type: string
                        version:
                          type: number
                        isDeployed:
                          type: boolean
                      required:
                      - network
                      - address
                      - version
                      - isDeployed
                    description: Parent user owned smart accounts list (for sub accounts)
                  subAccountIndex:
                    type: string
                  signUpMethod:
                    type: string
                    enum:
                    - email
                    - google
                    - apple
                    - wallet
                    - telegram
                    - twitter
                  platform:
                    type:
                    - string
                    - 'null'
                    enum:
                    - WEB_MOB
                    - WEB_DESKTOP
                    - WEB_OTHER
                    - APP_ANDROID
                    - APP_IOS
                  createdAt:
                    type: string
                  updatedAt:
                    type: string
                  lastSignInAt:
                    type:
                    - string
                    - 'null'
                  subscriptionStatus:
                    type: string
                    enum:
                    - none
                    - expired
                    - active
                    - canceling
                    - renewed
                    default: none
                  privilegiesType:
                    type:
                    - string
                    - 'null'
                    enum:
                    - premium
                    - academyCourse
                    default: null
                  type:
                    type: string
                    enum:
                    - user
                    - autotest
                    description: User type
                  accountType:
                    type: string
                    enum:
                    - main
                    - sub
                    - funded
                    description: Account type (main or sub)
                  accountStatus:
                    type: string
                    enum:
                    - active
                    - inactive
                    - initial
                    - smartAccountReady
                    description: Account status (active, inactive, etc.)
                  parent:
                    type:
                    - string
                    - 'null'
                    format: uuid
                    description: Parent account ID for sub accounts
                  isArchived:
                    type: boolean
                    description: Whether the sub account is archived
                  twofa:
                    type: boolean
                  permissions:
                    type: array
                    items:
                      type: string
                  subscriptionEndedAt:
                    type:
                    - string
                    - 'null'
                    default: null
                required:
                - id
                - avatar
                - cover
                - wallet
                - role
                - name
                - status
                - description
                - email
                - locale
                - telegramProfile
                - discordId
                - discordName
                - mobilePushEnabled
                - referralCode
                - smartAccountsList
                - signUpMethod
                - platform
                - createdAt
                - updatedAt
                - lastSignInAt
                - subscriptionStatus
                - privilegiesType
                - type
                - accountType
                - accountStatus
                - parent
                - isArchived
                - twofa
                - permissions
                - subscriptionEndedAt
    post:
      tags:
      - User
      security:
      - InternalToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserBody'
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User_2'
    servers:
    - url: https://auth-api.evedex.com
  /auth/user/{authId}/block:
    post:
      tags:
      - User
      security:
      - AccessToken: []
      parameters:
      - in: path
        name: authId
        schema:
          type: string
          format: uuid
        required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                blocked:
                  type: boolean
                  default: true
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
    servers:
    - url: https://auth-api.evedex.com
  /auth/wallet/transfer:
    get:
      tags:
      - User
      security:
      - AccessToken: []
      parameters:
      - in: query
        name: status
        schema:
          anyOf:
          - type: string
            enum:
            - pending
            - blocked
            - process
            - detained
            - done
            - refunded
            - error
          - type: array
            items:
              type: string
              enum:
              - pending
              - blocked
              - process
              - detained
              - done
              - refunded
              - error
      - in: query
        name: type
        schema:
          anyOf:
          - type: string
            enum:
            - deposit
            - withdraw
            - transfer-pfutures-balance
            - transfer-balance-pfutures
            - paymaster-fee
            - paymaster-refund
            - cashback-withdraw
            - lucky-shot-withdraw
            - smart-account-transfer
            - transfer-balance-sub-pfutures
          - type: array
            items:
              type: string
              enum:
              - deposit
              - withdraw
              - transfer-pfutures-balance
              - transfer-balance-pfutures
              - paymaster-fee
              - paymaster-refund
              - cashback-withdraw
              - lucky-shot-withdraw
              - smart-account-transfer
              - transfer-balance-sub-pfutures
      - in: query
        name: after
        schema:
          type:
          - string
          - 'null'
      - in: query
        name: before
        schema:
          type:
          - string
          - 'null'
      - in: query
        name: limit
        schema:
          $ref: '#/components/schemas/PageLimitParam'
      - in: query
        name: offset
        schema:
          $ref: '#/components/schemas/PageOffsetParam'
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  list:
                    type: array
                    items:
                      $ref: '#/components/schemas/WalletTransferWithFeesObject'
                  count:
                    type: number
                  next:
                    type: string
                required:
                - list
                - count
    servers:
    - url: https://auth-api.evedex.com
  /auth/transfer:
    get:
      tags:
      - User
      security:
      - AccessToken: []
      parameters:
      - in: query
        name: type
        schema:
          type: string
          enum:
          - deposit
          - withdrawal
          - smartAccountTransfer
          - partnerRewardTransfer
          - all
          default: deposit
      - in: query
        name: after
        schema:
          type:
          - string
          - 'null'
      - in: query
        name: before
        schema:
          type:
          - string
          - 'null'
      - in: query
        name: limit
        schema:
          $ref: '#/components/schemas/PageLimitParam'
      - in: query
        name: offset
        schema:
          $ref: '#/components/schemas/PageOffsetParam'
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  list:
                    type: array
                    items:
                      oneOf:
                      - type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                          authId:
                            type: string
                            format: uuid
                          type:
                            type: string
                            const: deposit
                          network:
                            type: string
                          destinationNetwork:
                            type:
                            - string
                            - 'null'
                          transactionHash:
                            type: string
                          wallet:
                            type: string
                            description: initial funds sender
                          depositor:
                            type: string
                            description: funds receiver (bridgeMiddleware contracts)
                          token:
                            type: string
                          amount:
                            type:
                            - string
                            - 'null'
                          status:
                            type: string
                            enum:
                            - pending
                            - detained
                            - process
                            - done
                            - refunded
                            - error
                          amlStatus:
                            type:
                            - string
                            - 'null'
                            enum:
                            - blocked
                            - pending
                            - process
                            - skip
                            - green
                            - red
                            - approve
                            - refund
                            - manual-red
                            - manual-green
                          originToken:
                            type:
                            - string
                            - 'null'
                          originAmount:
                            type:
                            - string
                            - 'null'
                          originAmountUsdt:
                            type:
                            - string
                            - 'null'
                          createdAt:
                            type: string
                          updatedAt:
                            type: string
                        required:
                        - id
                        - authId
                        - type
                        - network
                        - destinationNetwork
                        - transactionHash
                        - wallet
                        - depositor
                        - token
                        - amount
                        - status
                        - amlStatus
                        - originToken
                        - originAmount
                        - originAmountUsdt
                        - createdAt
                        - updatedAt
                      - type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                          authId:
                            type: string
                            format: uuid
                          type:
                            type: string
                            const: withdrawal
                          network:
                            type: string
                          destinationNetwork:
                            type:
                            - string
                            - 'null'
                          transactionHash:
                            type: string
                          destinationTransactionHash:
                            type:
                            - string
                            - 'null'
                          recipient:
                            type: string
                            description: funds receiver (in different network)
                          depositor:
                            type: string
                            description: funds sender
                          token:
                            type: string
                          amount:
                            type:
                            - string
                            - 'null'
                          status:
                            type: string
                            enum:
                            - pending
                            - detained
                            - process
                            - done
                            - refunded
                            - error
                          externalId:
                            type:
                            - string
                            - 'null'
                          fee:
                            type:
                            - object
                            - 'null'
                            properties:
                              total:
                                type:
                                - string
                                - 'null'
                              platform:
                                type:
                                - string
                                - 'null'
                              percentage:
                                type:
                                - string
                                - 'null'
                              gas:
                                type:
                                - string
                                - 'null'
                              feeCurrency:
                                type:
                                - string
                                - 'null'
                            required:
                            - total
                            - platform
                            - percentage
                            - gas
                            - feeCurrency
                          createdAt:
                            type: string
                          updatedAt:
                            type: string
                        required:
                        - id
                        - authId
                        - type
                        - network
                        - destinationNetwork
                        - transactionHash
                        - destinationTransactionHash
                        - recipient
                        - depositor
                        - token
                        - amount
                        - status
                        - externalId
                        - fee
                        - createdAt
                        - updatedAt
                      - type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                          authId:
                            type: string
                            format: uuid
                          type:
                            type: string
                            const: smartAccountTransfer
                          network:
                            type: string
                          transactionHash:
                            type: string
                          token:
                            type: string
                          amount:
                            type:
                            - string
                            - 'null'
                          status:
                            type: string
                            enum:
                            - pending
                            - detained
                            - process
                            - done
                            - refunded
                            - error
                          from:
                            type: string
                          to:
                            type: string
                          createdAt:
                            type: string
                          updatedAt:
                            type: string
                        required:
                        - id
                        - authId
                        - type
                        - network
                        - transactionHash
                        - token
                        - amount
                        - status
                        - from
                        - to
                        - createdAt
                        - updatedAt
                      - type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                          authId:
                            type: string
                            format: uuid
                          type:
                            type: string
                            const: partnerRewardTransfer
                          network:
                            type: string
                          transactionHash:
                            type: string
                          token:
                            type: string
                          amount:
                            type:
                            - string
                            - 'null'
                          from:
                            type: string
                          to:
                            type: string
                          status:
                            type: string
                            enum:
                            - pending
                            - detained
                            - process
                            - done
                            - refunded
                            - error
                          createdAt:
                            type: string
                          updatedAt:
                            type: string
                        required:
                        - id
                        - authId
                        - type
                        - network
                        - transactionHash
                        - token
                        - amount
                        - from
                        - to
                        - status
                        - createdAt
                        - updatedAt
                  count:
                    type: number
                  next:
                    type: string
                required:
                - list
                - count
    servers:
    - url: https://auth-api.evedex.com
  /auth/user/trading-view-settings:
    post:
      tags:
      - User
      security:
      - AccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserTradingViewSettingsBody'
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
    get:
      tags:
      - User
      security:
      - AccessToken: []
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserTradingViewSettingsResponse'
    servers:
    - url: https://auth-api.evedex.com
  /auth/user-profile:
    put:
      tags:
      - User
      security:
      - AccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfileUpdateBody'
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User_2'
    delete:
      tags:
      - User
      security:
      - AccessToken: []
      requestBody:
        required: true
        content:
