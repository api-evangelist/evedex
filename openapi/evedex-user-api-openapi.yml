      type: object
      properties:
        emailForConfirmation:
          type: string
          format: email
      required:
      - emailForConfirmation
    WalletBalanceObject:
      type: object
      properties:
        coin:
          type: string
        amount:
          type: string
      required:
      - coin
      - amount
    CreateUserBody:
      type: object
      properties:
        name:
          type: string
          default: ''
          description: Account name
        wallet:
          type: string
        role:
          type: string
          enum:
          - admin
          - manager
          - user
          - academy-curator
          - academy-moderator
        email:
