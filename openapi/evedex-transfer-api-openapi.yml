  /api/transfer/aml/unlock:
    post:
      tags:
      - Transfer
      security:
      - AccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                transferId:
                  type: string
                  format: uuid
                comment:
                  type:
                  - string
                  - 'null'
              required:
              - transferId
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
    servers:
    - url: https://bridge-middleware-api.evedex.com
  /api/transfer/aml/allow-future-deposits:
    post:
      tags:
      - Transfer
      security:
      - AccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                authId:
                  type: string
                  format: uuid
                comment:
                  type:
                  - string
                  - 'null'
              required:
              - authId
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
    servers:
    - url: https://bridge-middleware-api.evedex.com
  /api/transfer/detail:
    get:
      tags:
      - Transfer
      security:
      - AccessToken: []
      parameters:
      - in: query
        name: target
        description: Smart account or wallet address
        schema:
          type: string
          description: Smart account or wallet address
        required: true
      responses:
        '200':
          description: 200 OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  smartAccountAddress:
                    type: string
                  email:
                    type:
                    - string
                    - 'null'
                required:
                - smartAccountAddress
                - email
    servers:
    - url: https://exchange-api.evedex.com
  /api/transfer/pf/withdraw:
    post:
      tags:
      - Transfer
      security:
      - AccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                recipient:
                  type: string
                currency:
                  type: string
                  enum:
                  - usdt
                  default: usdt
                amount:
                  anyOf:
                  - type: number
                  - type: string
                signature:
                  type: string
                twofa:
                  type: object
                  properties:
                    code:
                      type: string
                  required:
                  - code
              required:
              - recipient
              - amount
              - signature
      responses:
        '200':
