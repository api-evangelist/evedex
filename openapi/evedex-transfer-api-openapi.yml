components:
  schemas:
    PageLimitParam:
      type: string
      default: '50'
    PageOffsetParam:
      type: string
      default: '0'
    EmptyResponse:
      type: object
    TransferWitHFeeObject:
      allOf:
      - $ref: '#/components/schemas/TransferObject'
      type: object
      properties:
        fees:
          type: array
          items:
            $ref: '#/components/schemas/TransferObject'
      required:
      - fees
    TransferObject:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user:
          type: string
          description: UserId
        type:
          type: string
          enum:
          - deposit
          - withdraw
          - transfer-pfutures-balance
          - transfer-balance-pfutures
          - paymaster-fee
          - paymaster-refund
          - cashback-withdraw
          - lucky-shot-withdraw
          - transfer-balance-sub-pfutures
        coin:
          type: string
        amount:
          type: number
        fee:
          type: number
          deprecated: true
        status:
          type: string
          enum:
          - pending
          - blocked
          - done
          - error
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
      - id
      - type
      - coin
      - amount
      - fee
      - status
      - createdAt
      - updatedAt
    TransferListObject:
      type: object
      properties:
        list:
          type: array
          items:
            $ref: '#/components/schemas/TransferWitHFeeObject'
        count:
          type: number
        next:
          type: string
      required:
      - list
      - count
  securitySchemes:
    AccessToken:
      type: http
      scheme: bearer
    InternalKey:
      type: http
      scheme: bearer
    ExternalKey:
      type: http
      scheme: bearer
    InternalToken:
      type: http
      scheme: bearer
    ApiKey:
      type: apiKey
      in: header
      name: X-API-Key
