      - in: query
        name: smartAccount
        schema:
          type: string
      - in: query
        name: search
        schema:
          type: string
      - in: query
        name: after
        schema:
          type:
          - string
          - 'null'
      - in: query
        name: before
        schema:
          type:
          - string
          - 'null'
      - in: query
        name: network
        schema:
          type: string
      - in: query
        name: depositStatus
        schema:
          anyOf:
          - type: string
            enum:
            - pending
            - detained
            - process
            - done
            - refunded
            - error
          - type: array
            items:
              type: string
              enum:
              - pending
