              - error
      - in: query
        name: amlStatus
        schema:
          anyOf:
          - type: string
            enum:
            - blocked
            - pending
            - process
            - skip
            - green
            - red
            - refund
            - manual-red
            - manual-green
          - type: array
            items:
              type: string
              enum:
              - blocked
