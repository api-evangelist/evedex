- name: EVEDEX Async API (Centrifugo)
  description: >-
    Real-time exchange events over WebSocket, brokered by Centrifugo with JWT channel access rights and
    epoch-based state recovery. Seventeen documented channels cover heartbeat, matcher state, instruments,
    order book depth and best, last trades, candlesticks, and per-user account, order, fill, fee, TP/SL,
    funding and transfer streams. No AsyncAPI document is published.
  humanURL: https://docs.evedex.com/developers/developers/public_exchange_data
  baseURL: https://docs.evedex.com
