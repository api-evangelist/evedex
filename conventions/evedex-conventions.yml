generated: '2026-08-26'
method: searched
source: https://docs.evedex.com/developers/developers/toolkit.md, https://docs.evedex.com/developers/developers/order_creation.md, harvested openapi/
docs: https://docs.evedex.com/developers/developers/toolkit
authentication:
  styles: [api-key, jwt-bearer]
  api_key: {header: x-api-key, issued_from: 'Exchange UI: Settings > API > Create API Key'}
  jwt:
    protocol: EIP-4361 Sign-In with Ethereum (SIWE)
    flow: GET /auth/nonce -> build SIWE message -> wallet signs -> POST /auth/user/sign-up -> token
    header: 'Authorization: Bearer {accessToken}'
    access_token_lifetime: a few minutes
    refresh: 'POST /auth/refresh with Authorization: Bearer {refreshToken}; on 401 from refresh, re-run the full SIWE flow'
  cross_link: authentication/evedex-authentication.yml
  source: https://docs.evedex.com/developers/developers/authorization.md
request_signing:
  standard: EIP-712 typed structured data
  applies_to:
  - limit / market / stop-limit order creation (and batch mass-limit)
  - limit and stop-limit order replacement
  - position closure
  - withdrawal from trading account
  - TP/SL creation, modification and cancellation
  field: signature
  library_recommended: ethers v6 Signer.signTypedData
  schema_source: https://github.com/evedex-official/exchange-crypto/blob/master/src/utils/crypto.ts
  numeric_normalization:
    rule: normalizeNumber = Round(floatValue * 10^8, HalfUp)
    exception: Withdrawal requests from the trading balance must always round Down.
    reason: Order data must contain no floating-point values at signing time.
  rejection_conditions:
  - signature missing
  - signature format not EIP-712 compliant
  - signature made with a wallet not belonging to the sender
  - order data differs from the data used to create the signature
  note: >-
    This is the single most consequential convention in the EVEDEX API and it has no analogue in a
    normal REST API. An agent cannot write to EVEDEX with a bearer token alone; it must hold or
    reach a wallet key and reproduce an exact numeric normalization. Getting the rounding mode
    wrong produces a valid-looking request that the exchange rejects.
  source: https://docs.evedex.com/developers/developers/toolkit.md
idempotency:
  supported: false
  header: null
  note: >-
    EVEDEX documents no idempotency key and none of the 557 harvested operations declares an
    Idempotency-Key parameter or any header parameter at all. The nearest mechanism is the v2
    client-generated orderId — the client mints
    `<days_since_2025-07-24>:<uuid_without_dashes>` (regex [0-9]{5}:[0-9A-Fa-f]{26}) and the
    format exists explicitly "to prevent identifiers duplication" — but EVEDEX never states that
    re-submitting the same orderId is a safe no-op rather than an error, so it cannot be relied on
    as an idempotency contract. Because idempotency is NOT genuinely supported, no `Idempotency`
    pointer is emitted in apis.yml.
  client_generated_id:
    field: orderId
    format: '<days_since_2025-07-24>:<uuid_without_dashes>'
    regex: '[0-9]{5}:[0-9A-Fa-f]{26}'
    example: '00008:418f0157db5345688b1c910d08'
    constraint: >-
      For batch limit-order creation the day prefix must be no earlier than midnight yesterday, or
      the request fails with "Invalid order ID date".
    source: https://docs.evedex.com/developers/developers/order_creation.md
pagination:
  style: offset-limit
  params: [limit, offset]
  secondary_params: [after, before, sort]
  observed: 'limit appears on 67 operations and offset on 66 across the eleven specs; after/before (ISO 8601 bounds) are used for time-ranged reads such as market-data history'
  response_fields: not documented
  cursor: false
  note: >-
    Offset/limit is used consistently but EVEDEX documents no default page size, no maximum limit,
    and no total-count or next-page field in responses. The one published cap is the market-data
    history endpoint's 100,000-candlestick response ceiling.
  method: derived
  source: harvested openapi/
