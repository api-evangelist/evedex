tools:
- name: list_instruments
  description: List every instrument registered on the exchange, with trading and visibility state.
  source_operation: openapi/evedex-exchange-openapi.json#GET /api/market/instrument
- name: get_market_state
  description: Read the exchange matcher state; any value other than "active" is a global trading halt.
  source_operation: openapi/evedex-exchange-openapi.json#GET /api/market
- name: get_price_history
  description: Fetch historical candlesticks for an instrument over a time range and timeframe.
  source_operation: openapi/evedex-market-data-openapi.json#GET /api/history/{instrument}/list
- name: list_orders
  description: List the authenticated user's orders.
  source_operation: openapi/evedex-exchange-openapi.json#GET /api/order
- name: list_positions
  description: List the authenticated user's open positions.
  source_operation: openapi/evedex-exchange-openapi.json#GET /api/position
- name: cancel_order
  description: Cancel a specific open order by id. Requires no wallet signature.
  source_operation: openapi/evedex-exchange-openapi.json#DELETE /api/order/{orderId}
- name: mass_cancel_orders
  description: Cancel all of the user's orders for one instrument.
  source_operation: openapi/evedex-exchange-openapi.json#POST /api/order/mass-cancel
tool_derivation_caveat: >-
  The harvested EVEDEX specs declare NO operationId on any of their 557 operations, so each tool
  above is bound to a verified METHOD + PATH rather than an operationId. An MCP server built from
  these specs would have to synthesise tool names, and two integrators would synthesise different
  ones — that is a direct, concrete cost of the missing operationIds.
write_tools_omitted: >-
  Order creation, order replacement, position closure and withdrawal are deliberately NOT proposed
  as candidate tools. Each requires an EIP-712 wallet signature over normalized integer values, so
  it cannot be executed by a server holding only an API key, and each moves real money.
