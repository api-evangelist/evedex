note: >-
  EVEDEX publishes NO MCP server. Searched the developer docs, the llms.txt index (which lists
  every documentation page EVEDEX publishes and names no MCP endpoint), the npm @evedex scope
  (four packages, none an MCP server), and the github.com/evedex-official org. No hosted endpoint
  and no stdio package exists, so no endpoint URL is asserted here. The tools below are a
  CANDIDATE surface derived from operations that genuinely exist in the harvested OpenAPI, offered
  as a design starting point — they are not something EVEDEX ships.
