note: >-
  EVEDEX serves a real llms.txt from its docs host, saved verbatim alongside this index. It is
  GitBook-generated: an H1 taken from the first page title ("Whitepaper | EVEDEX Docs"), then a
  single flat "## EVEDEX Docs" link list of ~90 documentation pages, each pointing at the .md
  representation. GitBook also appends an "Agent Instructions" block documenting a genuinely useful
  agent affordance — any page URL accepts `?ask=<question>` (and an optional `&goal=`) and returns a
  direct natural-language answer with sourced excerpts. That is a stronger agent surface than most
  providers offer and it is worth calling out.
strengths:
- Every documentation page is retrievable as markdown by appending .md — verified on 9 pages, all 200.
- The ?ask= query interface gives an agent a retrieval path that does not require crawling the whole corpus.
- The full developer section is indexed, including Toolkit, Authorization, Market Data and Order creation.
