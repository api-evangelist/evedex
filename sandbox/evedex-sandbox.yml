- name: Beta
  channel_prefix: futures-perp-beta
  source: https://docs.evedex.com/developers/developers/public_exchange_data.md
  note: Channel prefix is documented; no public host or sign-up path is published for it.
- name: Development
  channel_prefix: futures-perp-dev
  source: https://docs.evedex.com/developers/developers/public_exchange_data.md
  note: Channel prefix is documented; EVEDEX-internal, no public host published.
test_values:
  published: false
  test_cards: []
  test_wallets: []
  test_instruments: []
  note: None published. Because every write operation requires an EIP-712 signature from a real wallet the developer
    controls, EVEDEX has no shared test credential to hand out — but it also means there is no published funded
    demo wallet, so a developer cannot exercise the order path from a cold start without first onboarding through
    the demo UI.
time_simulation:
  supported: false
  note: No test clock or time-simulation facility is documented.
fixtures_and_triggers:
  published: false
  note: No fixture or trigger tooling for simulating fills, liquidations, ADL or funding events is documented. The
    heartbeat channel ({env}:heartbeat, considered lost after 30s of silence) is the only published way to assert
    the async surface is alive.
