generated: '2026-08-26'
method: searched
source: https://docs.evedex.com/developers/developers/exchange_bot_sdk.md
docs: https://docs.evedex.com/developers/developers/exchange_bot_sdk
note: 'EVEDEX ships a real, separately-hosted demo environment, not a test-mode flag on the production key. The
  SDK exposes it as a first-class container class — DemoContainer vs ProdContainer — so switching environments is
  a one-word change and there is no way to accidentally send a demo order to production with a production key. What
  EVEDEX does NOT publish is any magic test value: no test wallet, no funded demo private key, no seeded instrument,
  no simulated fill or liquidation trigger. A developer must bring their own Ethereum wallet and obtain demo balance
  through the demo exchange UI before the SDK''s demo container is useful.'
separation:
  model: separate-environment
  mechanism: distinct hostnames and distinct Centrifugo channel-name prefixes
  key_prefixes: none published
  note: EVEDEX does not prefix API keys by environment (no test_/live_ convention), so a key alone does not tell
    you which environment it belongs to. Environment is carried by the host you call and the SDK container you construct.
environments:
- name: Production
  channel_prefix: futures-perp
  sdk_container: evedexSdk.ProdContainer
  exchange_ui: https://exchange.evedex.com/
  source: https://docs.evedex.com/developers/developers/public_exchange_data.md
- name: Demo
  channel_prefix: futures-perp-demo
  sdk_container: evedexSdk.DemoContainer
  exchange_ui: https://exchange-demo.evedex.com/
  purpose: Testing. The environment the SDK docs point developers at.
  source: https://docs.evedex.com/developers/developers/exchange_bot_sdk.md
  probe:
    url: https://exchange-demo.evedex.com/
    status: <no response>
    result: DNS did not resolve at probe time (2026-08-26)
  probe_note: 'EVEDEX lists https://exchange-demo.evedex.com/ on its Official Links page as "Demo Exchange", and
    the SDK docs point developers at the demo environment via DemoContainer, but the hostname did not resolve when
