documented:
  method: searched
  source: https://docs.evedex.com/developers/developers/authorization.md
  checked: '2026-09-17'
  note: >-
    The scheme list above is derived from the 100+ refined specs; this block is what EVEDEX's own
    authorization page documents, which is narrower and clearer than the spec inventory. Only two of
    the schemes are consumer-facing: X-API-Key and the SIWE-minted JWT. InternalToken / InternalKey
    appear in the contract but are service-to-service and are not documented for third parties.
  mechanisms:
  - name: API key
    type: apiKey
    location: header
    header: x-api-key
    issuance: 'EVEDEX Exchange UI -> avatar -> Settings -> API -> Create API Key'
    rotation: 'POST /auth/api-key, DELETE + POST /auth/api-key/{apiKeyId}/restore in the Auth spec'
    scopes: none documented
  - name: JWT bearer (EIP-4361 Sign-In with Ethereum)
    type: http
    scheme: bearer
    header: 'Authorization: Bearer {accessToken}'
    flow:
    - 'GET /auth/nonce  (200, returns {"nonce": "..."} — verified unauthenticated 2026-09-17)'
    - build a SIWE message over address / uri / version / chainId / nonce / issuedAt
    - sign with the user's wallet (ethers Signer)
    - 'POST /auth/user/sign-up with {wallet, message, nonce, signature} -> {token}'
    access_token_lifetime: a few minutes (stated, not numerically specified)
    refresh: 'on 401, POST /auth/refresh with Authorization: Bearer {refreshToken}; a 401 from refresh means re-run the whole SIWE flow'
    spec_reference: https://eips.ethereum.org/EIPS/eip-4361
  host_discrepancy:
    finding: >-
      The authorization page's code sample calls https://auth.evedex.com/auth/nonce and
      https://auth.evedex.com/auth/user/sign-up, but the Auth OpenAPI declares
      servers[0] = https://auth-api.evedex.com and that is the host that answers.
    probes:
    - {url: 'https://auth-api.evedex.com/auth/nonce', status: 200, body: '{"nonce":"…"}'}
    - {url: 'https://auth.evedex.com/auth/nonce', status: 200, body: HTML single-page-app shell, not JSON}
    consequence: >-
      A developer who copies the documented sample verbatim gets an HTML body where a nonce should be
      and no error explaining why. Recorded as a provider-side documentation defect, not corrected in
      apis.yml — the contract's own servers[] is authoritative and already names the working host.
    checked: '2026-09-17'
  health_endpoint:
    url: https://exchange-api.evedex.com/api/ping
    status: 200
    body: '{"time":1789674957088}'
    auth_required: false
    note: Unauthenticated liveness probe; it is also the target EVEDEX's own uptime monitor checks every minute.
