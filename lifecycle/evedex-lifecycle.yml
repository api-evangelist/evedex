  correction:
    round: 1 (2026-08-26)
    prior_verdict: not-a-status-page
    detail: >-
      The 2026-08-26 pass fetched https://status.evedex.com/, saw an HTML shell with no component
      list and recorded the status page as ABSENT, emitting no StatusPage pointer. That verdict was
      wrong, and it was wrong in the exact way the pipeline warns about: the page is a
      client-rendered React app, so reading the served HTML says nothing about what it shows. Its
      JS bundle (/assets/index-nHC2ncTV.js) names the backing service outright — it calls
      https://uptime.evedex.com/api/getMonitor/Q7T0eX6fHp?m=<id> against four UptimeRobot monitors
      (landing, exchange, academy, affiliate). uptime.evedex.com is itself server-rendered and
      titled "EVEDEX EXCHANGE UPTIME". EVEDEX does publish a status page, with per-service monitors,
      minute-interval checks, a dated incident log and a JSON endpoint an agent can poll — a
      stronger availability surface than a static status page. Corrected 2026-09-17 and a
      StatusPage pointer is now emitted.
  method: probed
  checked: '2026-09-17'
availability_signals:
  - name: Matcher state
    mechanism: 'GET /api/market returns a `state` field; the {env}:info Centrifugo channel pushes snapshots'
    states: [active, request-status-fail, me-dead, db-admin-dead]
    note: >-
      Any state other than `active` is a global trading halt. This is the closest thing EVEDEX has
      to machine-readable availability, and it is genuinely better than a status page for an agent
      — but it covers only the matcher, not the eleven REST services.
    source: https://docs.evedex.com/developers/developers/public_exchange_data.md
  - name: Async API heartbeat
    mechanism: '{env}:heartbeat channel emits a timestamp; no event for >30s means the connection is lost'
    source: https://docs.evedex.com/developers/developers/public_exchange_data.md
