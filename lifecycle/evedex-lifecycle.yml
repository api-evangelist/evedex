generated: '2026-08-26'
method: searched
source: https://docs.evedex.com/developers/developers/order_creation.md, harvested openapi/
note: >-
  EVEDEX versions its API in the URI path and is visibly mid-migration: v2 order and position
  endpoints run alongside unversioned v1 equivalents in the same Exchange spec, and the docs
  describe the v2 orderId format as a deliberate replacement. What is missing is every piece of
  lifecycle governance around that migration — there is no deprecation policy, no sunset date for
  the v1 order endpoints, no Deprecation or Sunset header (RFC 8594) declared on any of the 557
  operations, no `deprecated: true` marker in any spec, no SLA. A status page DOES exist and was missed in round 1 — see status_page below.
versioning:
  scheme: uri-path
  current: v2
  observed: [unversioned, v2]
  docs: https://docs.evedex.com/developers/developers/order_creation
  detail: >-
    Order creation, order replacement and position closure exist as both /api/order/... and
    /api/v2/order/... . The v2 line introduced a structured orderId
    (<days_since_2025-07-24>:<uuid_without_dashes>, matching [0-9]{5}:[0-9A-Fa-f]{26}) to prevent
    identifier collisions.
deprecation:
  policy_url: null
  policy_published: false
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  note: >-
    No deprecation policy is published and no operation is marked deprecated in any spec, even
    though a v1/v2 split is live. The one deprecation signal EVEDEX gives is in SDK prose, not the
    API: the exchange-bot-sdk docs mark the `wsGateway` accessor "deprecated, not recommended to
    use". A consumer on the v1 order endpoints has no published notice period.
