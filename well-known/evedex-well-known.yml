note: >-
  EVEDEX serves NO /.well-known/ document of its own. Nineteen hosts x eight paths were probed on
  2026-09-17 — a re-probe and expansion of the 2026-08-26 round, which covered eight hosts. Every
  API host, plus evedex.com, www.evedex.com, docs.evedex.com, uptime. and swagger., answers a hard
  404 on every path. No WellKnown and no SecurityTxt pointer is emitted in apis.yml, because a
  pointer asserts the provider serves the surface and EVEDEX does not.
  TWO KINDS OF 200 ARE NOT DOCUMENTS, recorded here so a later round does not re-credit them.
  (1) SOFT-200 SPA CATCH-ALL on the four React app hosts — exchange., auth., status. and
  academy.evedex.com return HTTP 200 with content-type text/html and an SPA shell body for
  security.txt, openid-configuration, oauth-authorization-server, oauth-protected-resource and
  api-catalog alike. Their router does not catch the two .json agent-card paths, which 404
  honestly; the extensionless and .txt paths are swallowed. Nothing is served.
  (2) A VENDOR DOCUMENT on help.evedex.com — a real RFC 9116 security.txt served as text/plain, but
  it is INTERCOM's, not EVEDEX's: the help center is hosted Intercom and the file says so itself
  (Contact https://bugcrowd.com/intercom, mailto:security@intercom.com, Canonical
  https://app.intercom.com/.well-known/security.txt). Crediting EVEDEX with it would credit them
  with Intercom's bug bounty.
